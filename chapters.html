<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách chương · Truyện Dịch</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #090b14;
      --panel: #121728;
      --panel2: #181f35;
      --line: rgba(255, 255, 255, .1);
      --ink: #f7f8ff;
      --muted: #a7adc3;
      --brand: #a78bfa;
      --brand-glow: rgba(167, 139, 250, .35);
      --accent: #ec4899;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 8% 0%, #31205a 0, transparent 33%),
        radial-gradient(circle at 95% 8%, #173a62 0, transparent 28%),
        var(--bg);
    }

    .shell {
      max-width: 1080px;
      margin: auto;
      padding: 28px 24px 64px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 36px;
    }

    .back {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--line);
      transition: .2s;
      cursor: pointer;
    }

    .back:hover {
      transform: translateX(-3px);
      background: rgba(255, 255, 255, .14);
    }

    .brand {
      font-weight: 700;
      font-size: 16px;
    }

    .crumb-trail {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .crumb-link {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
    }

    .crumb-link:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    .crumb-sep {
      opacity: .5;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 25px;
      align-items: flex-end;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 8px 0 0;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.18;
      letter-spacing: -1.2px;
    }

    .counter {
      flex: none;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, .05);
    }

    .toolbar {
      display: flex;
      gap: 13px;
      margin-bottom: 19px;
    }

    .search {
      flex: 1;
      position: relative;
    }

    .search span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 13px 15px 13px 42px;
      color: var(--ink);
      font: inherit;
      outline: 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(8, 11, 23, .55);
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(167, 139, 250, .13);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    /* Nút Đọc tiếp */
    .continue {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px 20px;
      color: #fff;
      text-align: left;
      border: 1px solid rgba(167, 139, 250, .55);
      border-radius: 16px;
      background: linear-gradient(100deg, rgba(139, 92, 246, .32), rgba(236, 72, 153, .2));
      cursor: pointer;
      font: inherit;
      box-shadow: 0 10px 25px rgba(139, 92, 246, .18);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .continue:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(139, 92, 246, .3);
      border-color: #c4b5fd;
    }

    .continue-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 18px;
    }

    .continue-info {
      flex: 1;
      min-width: 0;
    }

    .continue strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
      color: #fff;
    }

    .continue small {
      display: block;
      color: #e2ddfe;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .continue-tag {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Thẻ chương */
    .chapter {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 78px;
      gap: 12px;
      padding: 12px 14px;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .03));
      transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
    }

    .chapter:hover {
      transform: translateY(-3px);
      border-color: var(--brand);
      background: rgba(167, 139, 250, .14);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
    }

    .chapter-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 18px;
    }

    .chapter-name {
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .folder .chapter-icon {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
    }

    /* Đánh dấu chương đang đọc */
    .chapter.is-reading {
      border-color: var(--brand);
      background: rgba(167, 139, 250, .18);
      box-shadow: 0 0 0 1px var(--brand), 0 8px 24px var(--brand-glow);
    }

    .chapter.is-reading .chapter-icon {
      background: linear-gradient(135deg, #a78bfa, #f43f5e);
    }

    .badge-reading {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #ede9fe;
      background: rgba(139, 92, 246, .7);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(196, 181, 253, .4);
      letter-spacing: .02em;
    }

    .state {
      grid-column: 1/-1;
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 17px;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-bottom: 12px;
      border: 3px solid rgba(255, 255, 255, .18);
      border-top-color: #c4b5fd;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Reader overlay */
    .reader {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #070910;
    }

    .reader.open {
      display: flex;
      flex-direction: column;
    }

    .reader-head {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: #101528;
      border-bottom: 1px solid var(--line);
      flex: none;
    }

    .reader-title-area {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reader-title {
      display: none;
    }

    .chapter-selector {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chapter-select {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      max-width: 250px;
    }

    .chapter-select option {
      color: #000;
      background: #fff;
    }

    .reader-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reader-tool {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #fff;
      background: #222944;
      cursor: pointer;
      font-size: 15px;
      transition: background .18s, opacity .18s;
    }

    .reader-tool:hover:not(:disabled) {
      background: #363f65;
    }

    .reader-tool:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .reader-nav-btn {
      background: rgba(167, 139, 250, .2);
      border-color: rgba(167, 139, 250, .4);
      font-weight: bold;
    }

    .reader-nav-btn:hover:not(:disabled) {
      background: rgba(167, 139, 250, .38);
    }

    .reader-close {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff !important;
      background: #e11d48 !important;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: background .18s;
      flex: none;
    }

    .reader-close:hover {
      background: #be123c !important;
    }

    #readerFrame {
      width: 100%;
      flex: 1;
      border: 0;
      display: block;
      background: #fdfbf7;
    }

      @media (max-width: 720px) {
        .shell {
          padding: 18px 15px 45px;
        }

        .top {
          margin-bottom: 24px;
        }

        .hero {
          display: block;
        }

        .counter {
          display: inline-block;
          margin-top: 14px;
        }

        .chapter-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 25px;
        }

        /* Ẩn hoàn toàn combobox chọn chương trên giao diện điện thoại */
        .reader-title-area,
        .chapter-selector {
          display: none !important;
        }

        /* Thanh điều khiển trên điện thoại: 1 hàng duy nhất siêu gọn gàng, nút bấm thoải mái */
        .reader-head {
          height: 52px;
          padding: 6px 12px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          flex-wrap: nowrap;
        }

        .reader-tools {
          display: flex;
          align-items: center;
          gap: 6px;
          flex: none;
        }

        .reader-tool {
          width: 36px;
          height: 36px;
          font-size: 15px;
          border-radius: 9px;
        }

        .reader-close {
          height: 36px;
          padding: 0 14px;
          font-size: 13px;
          border-radius: 9px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex: none;
        }
      }
  </style>
</head>

<body>
  <main class="shell">
    <header class="top">
      <a class="back" id="backBtn" href="index.html" aria-label="Quay lại">←</a>
      <div>
        <div class="brand">📖 Truyện Dịch</div>
        <div class="crumb-trail" id="crumbTrail">
          <a class="crumb-link" href="index.html">Thư viện</a>
          <span class="crumb-sep">/</span>
          <span id="crumbStory">Danh sách chương</span>
        </div>
      </div>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">Thư viện của bạn</div>
        <h1 id="storyName">Đang tải truyện...</h1>
      </div>
      <div id="counter" class="counter">Đang tải</div>
    </section>

    <div class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="chapterSearch" type="search" placeholder="Tìm tên chương..." autocomplete="off">
      </label>
    </div>

    <section id="chapterGrid" class="chapter-grid">
      <div class="state">
        <div class="spinner"></div><br>Đang tải danh sách chương...
      </div>
    </section>
  </main>

  <section id="reader" class="reader">
    <header class="reader-head">
      <div class="reader-title-area">
        <strong id="readerTitle" class="reader-title">Đang đọc</strong>
        <div class="chapter-selector">
          <select id="readerChapterSelect" class="chapter-select">
            <option value="">Chọn chương...</option>
          </select>
        </div>
      </div>
      <div class="reader-tools">
        <button id="ttsPlay" class="reader-tool" title="Đọc giọng nói / Tiếp tục">▶</button>
        <button id="ttsPause" class="reader-tool" title="Tạm dừng giọng nói">⏸</button>
        <button id="ttsStop" class="reader-tool" title="Dừng đọc">■</button>
        <button id="ttsSlow" class="reader-tool" title="Đọc chậm hơn">🐢</button>
        <button id="ttsFast" class="reader-tool" title="Đọc nhanh hơn">🐇</button>
        <button id="btnThemeToggle" class="reader-tool" title="Đổi giao diện Ngày/Đêm">☀️</button>
      </div>
      <button id="readerClose" class="reader-close">Đóng</button>
    </header>
    <iframe id="readerFrame" sandbox="allow-same-origin allow-scripts"></iframe>
  </section>

  <script>
    const API_KEY = 'AIzaSyB88SNWBpeBPRkg1KdgXc0K5rEOoih0zOM';
    const ACCESS_API_URL = 'https://script.google.com/macros/s/AKfycbxxe8gmlmrI6PBpr1bChBnAQFtuLzCyRfOQen8SKItnDl8sa2bIM5P5QH7EVZ_JX7cM/exec';

    const params = new URLSearchParams(location.search);
    const rootFolderId = params.get('folderId');
    const storyName = params.get('name') || 'Truyện';
    const shouldAutoRead = params.get('autoRead') === '1';

    const grid = document.getElementById('chapterGrid');
    const crumbTrail = document.getElementById('crumbTrail');
    const crumbStory = document.getElementById('crumbStory');
    const backBtn = document.getElementById('backBtn');

    let entries = [];
    let currentFolderId = rootFolderId;
    let folderHistory = []; // Stack lưu các thư mục cha để lùi lại
    let currentReadingFile = null;
    let ttsUtterance = null;
    let ttsRate = 1.05;
    let activeTextFile = false;
    let scrollSaveTimer = null;

    function deviceId() {
      try {
        let id = localStorage.getItem('deviceId');
        if (!id) {
          id = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') ? crypto.randomUUID() : 'device-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
          localStorage.setItem('deviceId', id);
        }
        return id;
      } catch (e) { return 'device-' + Math.random().toString(36).substring(2); }
    }

    function storyNumber(name) {
      if (!name) return '';
      const match = String(name).match(/^(\d+)/);
      return match ? match[1] : String(name).trim();
    }

    function stripExtension(name) {
      return (name || '').replace(/\.[^/.]+$/, '');
    }

    function lastKey() {
      return `truyen:last:${rootFolderId}`;
    }

    function progressKey(fileId) {
      return `truyen:progress:${fileId}`;
    }

    function saveLast(file) {
      if (!file || !file.id) return;
      const data = {
        id: file.id,
        name: file.name,
        mimeType: file.mimeType,
        storyFolderId: rootFolderId,
        storyName: storyName,
        currentFolderId: currentFolderId,
        time: Date.now()
      };

      // 1. Lưu theo truyện hiện tại
      localStorage.setItem(lastKey(), JSON.stringify(data));

      // 2. Cập nhật lịch sử đọc chung cho toàn website (dành cho trang chủ index.html)
      try {
        let history = JSON.parse(localStorage.getItem('truyen:history') || '[]');
        history = history.filter(item => item.storyFolderId !== rootFolderId);
        history.unshift(data);
        if (history.length > 20) history = history.slice(0, 20);
        localStorage.setItem('truyen:history', JSON.stringify(history));
      } catch (_) { }
    }

    function getLast() {
      try {
        return JSON.parse(localStorage.getItem(lastKey()));
      } catch (_) {
        return null;
      }
    }

    function saveCurrentScroll() {
      if (!activeTextFile || !currentReadingFile) return;
      try {
        const frame = document.getElementById('readerFrame');
        const doc = frame.contentDocument;
        if (!doc) return;
        const scrollY = doc.defaultView?.scrollY || doc.documentElement?.scrollTop || doc.body?.scrollTop || 0;
        if (scrollY > 0) {
          localStorage.setItem(progressKey(currentReadingFile.id), String(scrollY));
        }
      } catch (_) { }
    }

    async function verifyAccess() {
      const sNum = storyNumber(storyName);
      const lastCheck = Number(sessionStorage.getItem('access_' + sNum) || 0);
      // Nếu vừa được trang chủ kiểm tra quyền thành công trong vòng 10 phút -> Cho qua ngay, không cần gọi lại Apps Script!
      if (lastCheck && (Date.now() - lastCheck < 10 * 60 * 1000)) {
        return true;
      }

      try {
        const url = new URL(ACCESS_API_URL);
        url.search = new URLSearchParams({
          action: 'check',
          device_id: deviceId(),
          folder_id: sNum
        });
        const response = await fetch(url);
        const result = await response.json();
        const approved = response.ok && result.ok && result.approved === true;
        if (approved) {
          sessionStorage.setItem('access_' + sNum, String(Date.now()));
        }
        return approved;
      } catch (err) {
        console.error('Lỗi khi gọi verifyAccess:', err);
        throw err;
      }
    }

    async function fetchFiles(id) {
      const url = `https://www.googleapis.com/drive/v3/files?q='${id}'+in+parents&key=${API_KEY}&fields=files(id,name,mimeType)&pageSize=1000&_=${Date.now()}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Không thể tải danh sách chương.');
      const data = await response.json();
      return (data.files || [])
        .filter(f => f.mimeType.includes('folder') || f.mimeType.includes('html') || f.mimeType.includes('pdf'))
        .sort((a, b) => a.name.localeCompare(b.name, 'vi', { numeric: true }));
    }



    function updateBreadcrumb() {
      crumbStory.textContent = storyName;
      if (folderHistory.length > 0) {
        backBtn.onclick = event => {
          event.preventDefault();
          popFolder();
        };
      } else {
        backBtn.onclick = null;
        backBtn.href = 'index.html';
      }
    }

    function render(list) {
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<div class="state">Không tìm thấy chương phù hợp.</div>';
        return;
      }

      const last = getLast();
      const searchVal = document.getElementById('chapterSearch').value.trim();

      // Nút "Đọc tiếp" nếu có chương đã lưu và không đang tìm kiếm
      if (!searchVal && last) {
        const resume = document.createElement('button');
        resume.className = 'continue';
        resume.type = 'button';
        resume.innerHTML = `
          <span class="continue-icon">▶</span>
          <div class="continue-info">
            <strong>Tiếp tục đọc</strong>
            <small>${stripExtension(last.name)}</small>
          </div>
          <span class="continue-tag">Đọc tiếp</span>
        `;
        resume.onclick = () => openReader(last);
        grid.appendChild(resume);
      }

      list.forEach((file, index) => {
        const isFolder = file.mimeType.includes('folder');
        const isCurrentLast = last && last.id === file.id;

        const item = document.createElement('a');
        item.href = '#';
        item.className = `chapter ${isFolder ? 'folder' : ''} ${isCurrentLast ? 'is-reading' : ''}`;
        item.innerHTML = `
          <span class="chapter-icon">${isFolder ? '🗂️' : '📄'}</span>
          <span class="chapter-name"></span>
          ${isCurrentLast ? '<span class="badge-reading">Đang đọc</span>' : ''}
        `;
        item.querySelector('.chapter-name').textContent = stripExtension(file.name);
        item.onclick = event => {
          event.preventDefault();
          isFolder ? pushFolder(file) : openReader(file);
        };
        item.style.animation = `cardIn .35s ${Math.min(index, 12) * 25}ms both`;
        grid.appendChild(item);
      });

      document.getElementById('counter').textContent = `${list.length} mục`;
    }

    async function pushFolder(folder) {
      folderHistory.push({ id: currentFolderId, name: document.getElementById('storyName').textContent });
      currentFolderId = folder.id;
      document.getElementById('storyName').textContent = folder.name;
      updateBreadcrumb();
      grid.innerHTML = '<div class="state"><div class="spinner"></div><br>Đang tải thư mục...</div>';
      try {
        entries = await fetchFiles(folder.id);
        render(entries);
      } catch (err) {
        grid.innerHTML = `<div class="state">${err.message}</div>`;
      }
    }

    async function popFolder() {
      if (folderHistory.length === 0) return;
      const prev = folderHistory.pop();
      currentFolderId = prev.id;
      document.getElementById('storyName').textContent = prev.name;
      updateBreadcrumb();
      grid.innerHTML = '<div class="state"><div class="spinner"></div><br>Đang tải...</div>';
      try {
        entries = await fetchFiles(currentFolderId);
        render(entries);
      } catch (err) {
        grid.innerHTML = `<div class="state">${err.message}</div>`;
      }
    }

    async function openReader(file) {
      saveCurrentScroll(); // Lưu scroll của chương trước (nếu có)
      currentReadingFile = file;
      saveLast(file);

      // Cập nhật lại UI danh sách để đánh dấu chương đang đọc
      render(entries);

      const reader = document.getElementById('reader');
      const frame = document.getElementById('readerFrame');

      stopTTS();
      document.getElementById('readerTitle').textContent = stripExtension(file.name);
      reader.classList.add('open');
      applyThemeToIframe();

      activeTextFile = /\.html?$/i.test(file.name);
      document.querySelectorAll('.reader-tool').forEach(button => {
        button.disabled = !activeTextFile;
      });

      const select = document.getElementById('readerChapterSelect');
      if (select && entries) {
        select.innerHTML = '<option value="">Chọn chương</option>';
        entries.forEach(f => {
          if (!f.mimeType.includes('folder')) {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = stripExtension(f.name);
            if (f.id === file.id) opt.selected = true;
            select.appendChild(opt);
          }
        });
        select.onchange = (e) => {
          const fid = e.target.value;
          const targetFile = entries.find(f => f.id === fid);
          if (targetFile) openReader(targetFile);
        };
      }

      if (activeTextFile) {
        try {
          const response = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${API_KEY}`);
          if (!response.ok) throw new Error('Không thể tải nội dung file');
          const content = await response.text();
          const doc = frame.contentDocument || frame.contentWindow.document;
          doc.open();
          doc.write(content);
          doc.close();

          injectReadingStyle();
          applyThemeToIframe();
          setTimeout(applyThemeToIframe, 100);
          setTimeout(applyThemeToIframe, 400);

          const targetScroll = Number(localStorage.getItem(progressKey(file.id)) || 0);

          const applyScroll = () => {
            try {
              if (targetScroll > 0) {
                doc.defaultView?.scrollTo(0, targetScroll);
                if (doc.documentElement) doc.documentElement.scrollTop = targetScroll;
                if (doc.body) doc.body.scrollTop = targetScroll;
              }
            } catch (_) { }
          };

          // Khôi phục cuộn nhiều nhịp để đảm bảo layout tải xong
          setTimeout(applyScroll, 80);
          setTimeout(applyScroll, 350);
          setTimeout(applyScroll, 800);

          // Lắng nghe scroll để tự động ghi nhớ vị trí
          let timer;
          doc.defaultView?.addEventListener('scroll', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
              const currentY = doc.defaultView?.scrollY || doc.documentElement?.scrollTop || doc.body?.scrollTop || 0;
              if (currentY > 0) {
                localStorage.setItem(progressKey(file.id), String(currentY));
              }
            }, 150);
          }, { passive: true });

        } catch (error) {
          alert('Lỗi tải chương: ' + error.message);
        }
      } else {
        frame.src = `https://drive.google.com/file/d/${file.id}/preview`;
      }
    }

    let ttsNodes = [];
    let ttsIndex = 0;
    let ttsPaused = false;
    let ttsCurrent = null;
    let currentTheme = localStorage.getItem('readerTheme') || 'day';

    function applyThemeToIframe() {
      const frame = document.getElementById('readerFrame');
      if (frame) {
        frame.style.backgroundColor = currentTheme === 'night' ? '#181920' : '#fdfbf7';
      }

      const doc = frame?.contentDocument;
      if (!doc || !doc.body) return;

      doc.body.classList.remove('theme-day', 'theme-night');
      doc.body.classList.add(`theme-${currentTheme}`);
      if (doc.documentElement) {
        doc.documentElement.classList.remove('theme-day', 'theme-night');
        doc.documentElement.classList.add(`theme-${currentTheme}`);
      }

      const btn = document.getElementById('btnThemeToggle');
      if (btn) btn.textContent = currentTheme === 'day' ? '☀️' : '🌙';
    }

    document.getElementById('btnThemeToggle').onclick = () => {
      currentTheme = currentTheme === 'day' ? 'night' : 'day';
      localStorage.setItem('readerTheme', currentTheme);
      applyThemeToIframe();
    };

    function injectReadingStyle() {
      const frame = document.getElementById('readerFrame');
      const doc = frame?.contentDocument;
      if (!doc) return;
      let style = doc.getElementById("tts-reading-style");
      if (!style) {
        style = doc.createElement("style");
        style.id = "tts-reading-style";
        (doc.head || doc.documentElement || doc).appendChild(style);
      }
      style.textContent = `
        /* Khung đọc chiếm tối thiểu 100% màn hình, nội dung căn giữa cân đối */
        html {
          min-height: 100% !important;
        }

        body {
          min-height: 100% !important;
          max-width: 800px !important;
          margin-left: auto !important;
          margin-right: auto !important;
          padding: 24px 16px 80px !important;
          box-sizing: border-box !important;
        }

        img { max-width: 100% !important; height: auto !important; }
        table { max-width: 100% !important; }

        /* TÔ MÀU MẶC ĐỊNH (KỂ CẢ KHI BODY CHƯA KỊP GẮN CLASS THEME HOẶC TRÊN ĐIỆN THOẠI) */
        .reading,
        p.reading,
        h2.reading,
        h3.reading,
        div.reading,
        span.reading {
          background-color: #fef08a !important;
          color: #172554 !important;
          border-radius: 4px !important;
          box-shadow: 0 0 0 4px #fef08a !important;
          display: block !important;
          transition: background-color 0.2s, color 0.2s;
        }
        .reading *,
        .reading span,
        .reading font,
        .reading strong,
        .reading em {
          background-color: transparent !important;
          color: #172554 !important;
        }

        /* BAN NGÀY: Chữ đen sẫm dễ đọc trên nền giấy kem sáng */
        html.theme-day, body.theme-day {
          background-color: #fdfbf7 !important;
          color: #1a1a1a !important;
        }
        body.theme-day p, body.theme-day span, body.theme-day div, body.theme-day h1, body.theme-day h2, body.theme-day h3, body.theme-day li {
          color: #1a1a1a !important;
          background-color: transparent !important;
        }
        body.theme-day .reading, body.theme-day p.reading, body.theme-day h2.reading, body.theme-day h3.reading {
          background-color: #fef08a !important;
          color: #172554 !important;
          border-radius: 4px !important;
          box-shadow: 0 0 0 4px #fef08a !important;
        }
        body.theme-day .reading *, body.theme-day .reading span {
          background-color: transparent !important;
          color: #172554 !important;
        }

        /* BAN ĐÊM: Chữ xám sáng trên nền tối dịu mắt, khắc phục triệt để lỗi tàng hình chữ */
        html.theme-night, body.theme-night {
          background-color: #181920 !important;
          color: #e5e7eb !important;
        }
        body.theme-night p, body.theme-night span, body.theme-night div, body.theme-night h1, body.theme-night h2, body.theme-night h3, body.theme-night li {
          color: #e5e7eb !important;
          background-color: transparent !important;
        }
        body.theme-night .reading,
        body.theme-night p.reading,
        body.theme-night h2.reading,
        body.theme-night h3.reading,
        body.theme-night div.reading,
        body.theme-night span.reading {
          background-color: #854d0e !important;
          color: #ffffff !important;
          border-radius: 4px !important;
          box-shadow: 0 0 0 4px #854d0e !important;
        }
        body.theme-night .reading *,
        body.theme-night .reading span,
        body.theme-night .reading font,
        body.theme-night .reading strong,
        body.theme-night .reading em {
          background-color: transparent !important;
          color: #ffffff !important;
        }
      `;
    }

    let ttsPlaying = false;

    function clearHighlight() {
      if (ttsCurrent) {
        ttsCurrent.classList.remove("reading");
        ttsCurrent.style.removeProperty("background-color");
        ttsCurrent.style.removeProperty("color");
        ttsCurrent.style.removeProperty("border-radius");
        ttsCurrent.style.removeProperty("box-shadow");
        ttsCurrent = null;
      }
    }

    function stopTTS() {
      ttsPlaying = false;
      ttsPaused = false;
      if (ttsUtterance) {
        ttsUtterance.onend = null;
        ttsUtterance.onerror = null;
        ttsUtterance = null;
      }
      window._activeUtterance = null;
      if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      clearHighlight();
      ttsNodes = [];
      ttsIndex = 0;
    }

    function pauseTTS() {
      if (!ttsPlaying || ttsPaused) return;
      ttsPaused = true;
      if (ttsUtterance) {
        ttsUtterance.onend = null;
        ttsUtterance.onerror = null;
      }
      if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      // Giữ nguyên highlight ttsCurrent để người dùng thấy rõ vị trí đang dừng
    }

    function togglePauseTTS() {
      if (!ttsPlaying) return;
      if (ttsPaused) {
        ttsPaused = false;
        readNext();
      } else {
        pauseTTS();
      }
    }

    function speakText() {
      if (!activeTextFile || !window.speechSynthesis) return;

      // 1. Nếu đang tạm dừng -> Bấm Play để tiếp tục đọc lại đoạn đang dừng đó
      if (ttsPlaying && ttsPaused) {
        ttsPaused = false;
        readNext();
        return;
      }

      // 2. Bắt đầu lượt đọc mới
      stopTTS();
      ttsPlaying = true;
      ttsPaused = false;

      injectReadingStyle();
      applyThemeToIframe();

      const frame = document.getElementById('readerFrame');
      const doc = frame?.contentDocument;
      if (!doc || !doc.body) return;

      ttsNodes = [];
      ttsIndex = 0;

      doc.querySelectorAll("p, h2, h3").forEach(el => {
        const text = el.innerText?.trim() || "";
        const lower = text.toLowerCase();
        // Bỏ qua hẳn đoạn nếu chứa text cảnh báo/bản quyền
        if (lower.includes('dịch bởi') || lower.includes('tôn trọng mình') || lower.includes('bán lại') || lower.includes('bản quyền')) return;

        const rect = el.getBoundingClientRect();
        // Lấy đoạn văn từ mép trên màn hình trở xuống
        if (rect.bottom >= 10 && text) {
          ttsNodes.push(el);
        }
      });

      // Nếu không tìm thấy đoạn nào từ vị trí cuộn thì đọc từ đầu
      if (ttsNodes.length === 0) {
        doc.querySelectorAll("p, h2, h3").forEach(el => {
          const text = el.innerText?.trim() || "";
          const lower = text.toLowerCase();
          if (lower.includes('dịch bởi') || lower.includes('tôn trọng mình') || lower.includes('bán lại') || lower.includes('bản quyền')) return;
          if (text) ttsNodes.push(el);
        });
      }

      readNext();
    }

    function readNext() {
      // Nếu đã bấm dừng hoặc đang tạm dừng hoặc hết danh sách thì dừng lại ngay
      if (!ttsPlaying || ttsPaused || ttsIndex >= ttsNodes.length) {
        if (!ttsPaused) {
          stopTTS();
        }
        return;
      }

      const el = ttsNodes[ttsIndex];
      clearHighlight();
      ttsCurrent = el;

      // 1. Thêm class reading
      el.classList.add("reading");

      // 2. Trực tiếp áp dụng inline style để chống bị đè CSS trên trình duyệt điện thoại
      const frame = document.getElementById('readerFrame');
      const doc = frame?.contentDocument;
      const isNight = currentTheme === 'night' || (doc?.body && doc.body.classList.contains('theme-night'));
      const hlBg = isNight ? '#854d0e' : '#fef08a';
      const hlColor = isNight ? '#ffffff' : '#172554';
      el.style.setProperty('background-color', hlBg, 'important');
      el.style.setProperty('color', hlColor, 'important');
      el.style.setProperty('border-radius', '4px', 'important');
      el.style.setProperty('box-shadow', `0 0 0 4px ${hlBg}`, 'important');

      // 3. Cuộn mượt mà đưa đoạn đang đọc vào giữa màn hình
      try {
        const docView = doc?.defaultView || frame?.contentWindow;
        if (docView) {
          const rect = el.getBoundingClientRect();
          const currentY = docView.scrollY || doc?.documentElement?.scrollTop || doc?.body?.scrollTop || 0;
          const targetY = currentY + rect.top - (docView.innerHeight / 2) + (rect.height / 2);
          docView.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
        } else {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } catch (_) {
        try { el.scrollIntoView(true); } catch (_) {}
      }

      let textToRead = el.innerText || "";
      // Lọc watermark khỏi đoạn cần đọc
      textToRead = textToRead.replace(/TÂN-0566681993/gi, '')
        .replace(/0566681993/g, '')
        .replace(/Tân/gi, '')
        .replace(/watermark/gi, '');

      if (!textToRead.trim()) {
        clearHighlight();
        ttsIndex++;
        readNext();
        return;
      }

      if (ttsUtterance) {
        ttsUtterance.onend = null;
        ttsUtterance.onerror = null;
      }

      ttsUtterance = new SpeechSynthesisUtterance(textToRead);
      ttsUtterance.lang = "vi-VN";
      ttsUtterance.rate = ttsRate;
      window._activeUtterance = ttsUtterance;

      ttsUtterance.onend = () => {
        if (!ttsPlaying || ttsPaused) return;
        clearHighlight();
        ttsIndex++;
        readNext();
      };

      ttsUtterance.onerror = () => {
        if (!ttsPlaying || ttsPaused) return;
        clearHighlight();
        ttsIndex++;
        readNext();
      };

      try {
        speechSynthesis.speak(ttsUtterance);
      } catch (err) {
        console.error('Lỗi khi gọi speak:', err);
      }
    }

    document.getElementById('ttsPlay').onclick = speakText;
    document.getElementById('ttsPause').onclick = togglePauseTTS;
    document.getElementById('ttsStop').onclick = stopTTS;
    document.getElementById('ttsSlow').onclick = () => {
      ttsRate = Math.max(.6, Number((ttsRate - .1).toFixed(2)));
    };
    document.getElementById('ttsFast').onclick = () => {
      ttsRate = Math.min(2, Number((ttsRate + .1).toFixed(2)));
    };

    document.getElementById('readerClose').onclick = () => {
      saveCurrentScroll();
      stopTTS();
      const reader = document.getElementById('reader');
      reader.classList.remove('open');
      const frame = document.getElementById('readerFrame');
      frame.src = 'about:blank';
      currentReadingFile = null;
      render(entries);
    };

    window.addEventListener('beforeunload', stopTTS);
    window.addEventListener('pagehide', stopTTS);

    document.getElementById('chapterSearch').oninput = event => {
      const key = event.target.value.toLocaleLowerCase('vi').trim();
      render(entries.filter(item => item.name.toLocaleLowerCase('vi').includes(key)));
    };

    async function init() {
      document.getElementById('storyName').textContent = storyName;
      updateBreadcrumb();
      if (!rootFolderId) {
        grid.innerHTML = '<div class="state">Thiếu thông tin truyện. Hãy quay lại thư viện.</div>';
        return;
      }
      try {
        const hasAccess = await verifyAccess();
        if (!hasAccess) {
          localStorage.setItem('errorFolderName', storyName);
          location.replace('email.html');
          return;
        }
        entries = await fetchFiles(rootFolderId);
        render(entries);

        // Nếu từ trang chủ bấm "Đọc tiếp" thì tự động mở ngay chương đang đọc
        if (shouldAutoRead) {
          const last = getLast();
          if (last) {
            openReader(last);
          }
        }
      } catch (error) {
        grid.innerHTML = `<div class="state">❌ ${error.message || 'Lỗi kết nối kiểm tra quyền. Vui lòng tải lại trang.'}</div>`;
      }
    }

    init();
  </script>
</body>
